<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IndustraFlow | Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body class="selection:bg-secondary selection:text-on-secondary" style="overflow:hidden;">

<!-- Top Navigation -->
<header class="app-header">
  <div class="header-left">
    <button class="material-symbols-outlined icon-btn text-primary" onclick="window.location.href='dashboard.html'">arrow_back</button>
    <div style="display:flex; align-items:center; gap:8px;">
      <span class="material-symbols-outlined brand-icon">precision_manufacturing</span>
      <h1 class="font-headline-sm text-on-surface" style="margin:0;">IndustraFlow Editor</h1>
    </div>
  </div>
  <div class="header-right">
    <button class="icon-btn" style="background:var(--surface-variant); border-radius:4px; display:flex; align-items:center; justify-content:center;">
      <span class="material-symbols-outlined">undo</span>
    </button>
    <button class="btn-primary" style="padding: 8px 16px;">
      <span class="material-symbols-outlined" style="font-size:20px;">save</span>
      SALVAR
    </button>
    <button class="material-symbols-outlined icon-btn">account_circle</button>
  </div>
</header>

<main class="main-editor dot-grid">
  <div class="canvas-container">
    
    <!-- Node 1: Start -->
    <div class="node node-start">
      <div class="indicator"></div>
      <div style="display:flex; flex-direction:column;">
        <span class="font-label-sm text-on-surface-variant">ENTRADA</span>
        <p class="font-body-md text-on-surface" style="font-weight:600;">Matéria Prima</p>
      </div>
    </div>
    
    <div class="arrow"></div>
    
    <!-- Node 2: Process -->
    <div class="node node-process">
      <div class="left-bar"></div>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div style="display:flex; flex-direction:column;">
          <span class="font-label-sm text-on-surface-variant">OPERAÇÃO 02</span>
          <p class="font-body-md text-on-surface" style="font-weight:700;">Processamento</p>
        </div>
        <span class="material-symbols-outlined text-primary">precision_manufacturing</span>
      </div>
      <div style="height:1px; background:var(--outline-variant); width:100%;"></div>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="font-label-sm text-on-surface-variant">TEMP: 84°C</span>
        <span class="font-label-sm text-on-surface-variant">RPM: 1200</span>
      </div>
    </div>
    
    <div class="arrow"></div>
    
    <!-- Node 3: Decision -->
    <div class="node node-decision">
      <div class="bg-diamond diamond"></div>
      <span class="material-symbols-outlined" style="color:var(--tertiary); margin-bottom:8px;">search</span>
      <p class="font-body-md text-on-surface" style="font-weight:600;">Inspeção</p>
      <span class="font-label-sm text-on-surface-variant">Qualidade</span>
    </div>

  </div>

  <!-- Toolbox Toggle FAB -->
  <button class="fab" style="bottom:120px;" onclick="toggleTools()">
    <span class="material-symbols-outlined" style="font-size:32px;">add</span>
  </button>
</main>

<!-- Bottom Sheet Toolbar -->
<aside id="tools-sheet" class="bottom-sheet glass-panel" style="transform:translateY(100%); transition:transform 0.3s ease;">
  <div class="sheet-handle"></div>
  <div class="tools-grid">
    <div class="tool-item">
      <button class="tool-btn">
        <span class="material-symbols-outlined text-on-surface-variant">rectangle</span>
      </button>
      <span class="font-label-sm text-on-surface-variant">Processo</span>
    </div>
    
    <div class="tool-item">
      <button class="tool-btn">
        <div class="tool-diamond"><div class="inner"></div></div>
      </button>
      <span class="font-label-sm text-on-surface-variant">Decisão</span>
    </div>
    
    <div class="tool-item">
      <button class="tool-btn" style="border-radius:24px;">
        <span class="material-symbols-outlined text-on-surface-variant">radio_button_unchecked</span>
      </button>
      <span class="font-label-sm text-on-surface-variant">Início</span>
    </div>

    <div class="tool-item">
      <button class="tool-btn">
        <span class="material-symbols-outlined text-on-surface-variant">settings_suggest</span>
      </button>
      <span class="font-label-sm text-on-surface-variant">Máquina</span>
    </div>

    <div class="tool-item">
      <button class="tool-btn">
        <span class="material-symbols-outlined text-on-surface-variant">person_apron</span>
      </button>
      <span class="font-label-sm text-on-surface-variant">Op.</span>
    </div>

    <div class="tool-item">
      <button class="tool-btn">
        <span class="material-symbols-outlined text-on-surface-variant">local_shipping</span>
      </button>
      <span class="font-label-sm text-on-surface-variant">Transp.</span>
    </div>
  </div>
</aside>

<script>
let toolsOpen = false;
function toggleTools() {
  const sheet = document.getElementById('tools-sheet');
  const fab = document.querySelector('.fab .material-symbols-outlined');
  toolsOpen = !toolsOpen;
  
  if (toolsOpen) {
    sheet.style.transform = 'translateY(0)';
    fab.innerText = 'close';
  } else {
    sheet.style.transform = 'translateY(100%)';
    fab.innerText = 'add';
  }
}

// Parallax dot grid effect on mouse move
document.querySelector('.main-editor').addEventListener('mousemove', e => {
  const { clientX, clientY } = e;
  // Slow down the movement by dividing by a larger number
  e.currentTarget.style.backgroundPosition = `${clientX/80}px ${clientY/80}px`;
});
</script>
</body>
</html>
