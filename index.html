<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IndustraFlow | Acesso ao Sistema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body class="page-login">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="topbar-brand">
      <span class="material-symbols-outlined brand-icon">precision_manufacturing</span>
      <span class="brand-name">IndustraFlow</span>
    </div>
  </header>

  <!-- MAIN LOGIN -->
  <main class="login-main dot-grid">
    <div class="login-card glass-panel">
      <div class="login-brand-block">
        <div class="login-icon-wrap">
          <div class="login-icon-glow"></div>
          <span class="material-symbols-outlined login-icon">precision_manufacturing</span>
        </div>
        <h1 class="login-title">Acesso ao Sistema</h1>
        <p class="login-subtitle">CONTROLE OPERACIONAL CENTRALIZADO</p>
      </div>

      <form class="login-form" onsubmit="handleLogin(event)">
        <div class="field-group">
          <label class="field-label">ID DO COLABORADOR / E-MAIL</label>
          <div class="field-wrap">
            <span class="material-symbols-outlined field-icon">badge</span>
            <input id="login-id" type="text" class="field-input" placeholder="INS-0000-00" autocomplete="username" />
          </div>
        </div>

        <div class="field-group">
          <label class="field-label">SENHA</label>
          <div class="field-wrap">
            <span class="material-symbols-outlined field-icon">lock</span>
            <input id="login-pw" type="password" class="field-input" placeholder="••••••••"
              autocomplete="current-password" />
          </div>
        </div>

        <div class="login-options">
          <label class="checkbox-label">
            <input type="checkbox" class="checkbox-input" />
            <span class="checkbox-text">Lembrar-me</span>
          </label>
          <a href="#" class="link-primary">Esqueci minha senha</a>
        </div>

        <button type="submit" class="btn-primary btn-full">
          <span>ENTRAR</span>
          <span class="material-symbols-outlined btn-arrow">arrow_forward</span>
        </button>
      </form>
    </div>

    <!-- Atmospheric corner lines -->
    <div class="atm-corner atm-tl"></div>
    <div class="atm-corner atm-br"></div>
    <div class="atm-watermark">SYSTEM_REV_8.4</div>
  </main>

  <!-- FOOTER -->
  <footer class="login-footer">
    <div class="footer-left">
      <span class="footer-brand">IndustraFlow</span>
      <span class="footer-copy">© 2024 IndustraFlow Operational Systems. All rights reserved.</span>
    </div>
    <div class="footer-links">
      <a href="#">Support</a>
      <a href="#">Política de Privacidade</a>
      <a href="#">Termos de Serviço</a>
    </div>
  </footer>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      btn.classList.add('loading');
      btn.innerHTML = '<span class="material-symbols-outlined spin">progress_activity</span> Verificando...';
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1000);
    }

    // Parallax dot grid
    document.querySelector('.login-main').addEventListener('mousemove', e => {
      const { clientX, clientY } = e;
      e.currentTarget.style.backgroundPosition = `${clientX / 60}px ${clientY / 60}px`;
    });
  </script>
</body>

</html>
