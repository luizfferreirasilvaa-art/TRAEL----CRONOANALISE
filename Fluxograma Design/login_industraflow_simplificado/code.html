<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .dot-grid {
            background-image: radial-gradient(circle, #44464f 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .industrial-glow {
            box-shadow: 0 0 15px rgba(176, 198, 255, 0.1);
        }

        .glass-panel {
            backdrop-filter: blur(12px);
            background-color: rgba(25, 31, 45, 0.8);
        }

<body class="bg-background text-on-surface font-body-md selection:bg-primary-container selection:text-on-primary-container overflow-hidden">
<!-- Top Navigation -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-md py-sm bg-surface border-b border-outline-variant">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="precision_manufacturing">precision_manufacturing</span>
<span class="font-headline-sm text-headline-sm font-bold tracking-tight text-on-surface">IndustraFlow</span>
</div>
</header>
<!-- Main Content Area -->
<main class="relative min-h-screen w-full flex items-center justify-center dot-grid px-canvas-margin">
<!-- Login Card -->
<div class="w-full max-w-[440px] z-10">
<div class="glass-panel border-2 border-outline-variant rounded-lg p-xl industrial-glow transition-all duration-300 hover:border-primary">
<!-- Branding & Welcome -->
<div class="flex flex-col items-center mb-xl">
<div class="relative w-24 h-24 mb-md group">
<div class="absolute inset-0 bg-primary/20 rounded-full blur-xl group-hover:bg-primary/30 transition-colors"></div>
<img alt="IndustraFlow Corporate Identity" class="relative z-10 w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/ADBb0ui8AnQe3LO7cb9u7u1nxJTf2SfgpwYTqOmj5cMYZIph_vFcuXAESBWqlj_5qxiwLG_wkdl5B7hgpvt1_vniUzzBFloiidkXOTg2CEvEUIu-zxcIUjilSJhNNGN8aP48KAH-WOrYqeyhT6MQmFMEkodd48_Y0KnpYdqEj9sacwVui-v5q92G11cd3Gz2fD7ANF07BqOD8KTLjgmhZ2akF5YHD1Lb8XaWapdtKyEk0nW_nva9HIMgDt5KqQ"/>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-xs">Acesso ao Sistema</h1>
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Controle Operacional Centralizado</p>
</div>
<!-- Form Fields -->
<form class="space-y-lg" onsubmit="event.preventDefault();">
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-outline block uppercase tracking-wider">ID do Colaborador / E-mail</label>
<div class="relative flex items-center">
<span class="absolute left-md material-symbols-outlined text-outline text-[20px]" data-icon="badge">badge</span>
<input class="w-full pl-[48px] pr-md py-md bg-surface-container-low border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none rounded transition-all text-on-surface placeholder:text-outline/50 font-body-md" placeholder="INS-0000-00" type="text"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-outline block uppercase tracking-wider">Senha</label>
<div class="relative flex items-center">
<span class="absolute left-md material-symbols-outlined text-outline text-[20px]" data-icon="lock">lock</span>
<input class="w-full pl-[48px] pr-md py-md bg-surface-container-low border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none rounded transition-all text-on-surface placeholder:text-outline/50 font-body-md" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Options -->
<div class="flex items-center justify-between">
<label class="flex items-center gap-sm cursor-pointer group">
<input class="w-4 h-4 rounded-sm border-outline-variant bg-surface-container-low text-primary focus:ring-offset-background focus:ring-primary" type="checkbox"/>
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-on-surface transition-colors">Lembrar-me</span>
</label>
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Esqueci minha senha</a>
</div>
<!-- Action Button -->
<button class="w-full py-md bg-primary text-on-primary font-headline-sm rounded-lg active:scale-95 transition-all flex items-center justify-center gap-sm hover:bg-primary/90 shadow-lg shadow-primary/10 group mt-lg">
<span>ENTRAR</span>
<span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
</div>
</div>
<!-- Atmospheric Elements -->
<div class="absolute top-20 left-20 w-32 h-32 border-l border-t border-outline-variant opacity-20 pointer-events-none"></div>
<div class="absolute bottom-20 right-20 w-32 h-32 border-r border-b border-outline-variant opacity-20 pointer-events-none"></div>
<div class="absolute top-1/2 left-10 -translate-y-1/2 font-label-sm text-outline rotate-90 tracking-[0.5em] opacity-30 select-none">SYSTEM_REV_8.4</div>
</main>
<!-- Footer -->
<footer class="fixed bottom-0 w-full flex flex-col md:flex-row items-center justify-between px-canvas-margin py-lg bg-surface-container-lowest border-t border-outline-variant">
<div class="flex items-center gap-md mb-md md:mb-0">
<span class="font-label-md text-label-md font-bold text-outline">IndustraFlow</span>
<span class="font-label-sm text-label-sm text-secondary">© 2024 IndustraFlow Operational Systems. All rights reserved.</span>

<div class="flex gap-lg">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Support</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Terms of Service</a>
</div>
</footer>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    input.parentElement.parentElement.classList.add('scale-[1.01]');
                });
                input.addEventListener('blur', () => {
                    input.parentElement.parentElement.classList.remove('scale-[1.01]');
                });
            });

            const main = document.querySelector('main');
            main.addEventListener('mousemove', (e) => {
                const { clientX, clientY } = e;
                main.style.backgroundPosition = `${clientX / 50}px ${clientY / 50}px`;
            });
        });
    </script>
</body></html>
